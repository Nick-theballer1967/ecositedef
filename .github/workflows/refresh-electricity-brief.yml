name: Refresh Electricity Brief Branding

on:
  push:
    paths:
      - '.github/workflows/refresh-electricity-brief.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Refresh electricity brief branding
        shell: python
        run: |
          import fitz, pathlib
          src=pathlib.Path("ecoai-electricity-brief.pdf")
          out=pathlib.Path("ecoai-electricity-brief.new.pdf")
          doc=fitz.open(src)
          TEAL=(0.043,0.569,0.541); GREY=(0.427,0.490,0.518); WHITE=(1,1,1)
          for page in doc:
              hits=page.search_for("Optimise. Operate. Outperform.")
              for r in hits:
                  rr=fitz.Rect(r.x0-2,r.y0-2,r.x1+2,r.y1+2)
                  page.add_redact_annot(rr,fill=WHITE)
              if hits:
                  page.apply_redactions()
                  r=hits[0]
                  page.insert_textbox(
                      fitz.Rect(r.x0, r.y0-1, min(page.rect.width-36, r.x0+330), r.y1+18),
                      "Dynamic, real-time HVAC optimisation - delivering energy savings automatically.",
                      fontsize=6.3,fontname="hebo",color=TEAL,overlay=True
                  )
          doc.save(out,garbage=4,deflate=True)
          doc.close()
          out.replace(src)

      - name: Commit refreshed electricity brief
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ecoai-electricity-brief.pdf
          if git diff --cached --quiet; then
            echo "No electricity brief change."
          else
            git commit -m "Refresh electricity brief branding"
            git push
          fi
