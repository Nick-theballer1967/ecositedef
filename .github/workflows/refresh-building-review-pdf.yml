name: Refresh Building Review Guide PDF

on:
  push:
    paths:
      - '.github/workflows/refresh-building-review-pdf.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet reportlab pillow
      - name: Generate refreshed Building Review Guide
        shell: python
        run: |
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.colors import HexColor, white
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.pdfbase import pdfmetrics
          from reportlab.lib.utils import ImageReader
          from reportlab.pdfbase.pdfmetrics import stringWidth
          from pathlib import Path

          out = Path("assets/docs/ecoai-building-review-and-qualification-guide.pdf")
          logo = Path("assets/logo-primary.png")
          W,H=A4
          fd="/usr/share/fonts/truetype/dejavu"
          pdfmetrics.registerFont(TTFont("DVS",f"{fd}/DejaVuSans.ttf"))
          pdfmetrics.registerFont(TTFont("DVSB",f"{fd}/DejaVuSans-Bold.ttf"))
          pdfmetrics.registerFont(TTFont("DVSF",f"{fd}/DejaVuSerif-Bold.ttf"))

          NAVY=HexColor("#123E4A"); TEAL=HexColor("#0B918A"); GREY=HexColor("#6D7D84")
          LIGHT=HexColor("#F5F8F8"); MINT=HexColor("#E8F5F3"); LINE=HexColor("#AFD7D2"); WHITE=white
          c=canvas.Canvas(str(out),pagesize=A4)

          def txt(x,y,s,size=9,font="DVS",color=NAVY):
              c.setFillColor(color); c.setFont(font,size); c.drawString(x,y,s)
          def wrap_lines(s,font,size,maxw):
              words=s.split(); lines=[]; cur=""
              for w in words:
                  t=w if not cur else cur+" "+w
                  if stringWidth(t,font,size)<=maxw: cur=t
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines
          def wrapped(x,y,s,maxw,size=8,font="DVS",color=GREY,leading=None):
              if leading is None: leading=size*1.2
              c.setFillColor(color); c.setFont(font,size)
              yy=y
              for line in wrap_lines(s,font,size,maxw):
                  c.drawString(x,yy,line); yy-=leading
              return yy
          def rounded(x,y,w,h,fill=LIGHT,stroke=LINE,r=7):
              c.setFillColor(fill); c.setStrokeColor(stroke); c.setLineWidth(.7)
              c.roundRect(x,y,w,h,r,fill=1,stroke=1)
          def header(first=False):
              c.drawImage(ImageReader(str(logo)),58,H-78,width=122,height=47,preserveAspectRatio=True,mask="auto")
              if first:
                  txt(183,H-50,"Dynamic, real-time HVAC optimisation",7.2,"DVSB",TEAL)
                  txt(183,H-63,"delivering energy savings automatically.",7.0,"DVS",GREY)
              c.setFont("DVSB",7.0); c.setFillColor(TEAL)
              c.drawRightString(W-58,H-48,"BUILDING REVIEW")
              c.drawRightString(W-58,H-63,"& QUALIFICATION GUIDE")
              c.setStrokeColor(LINE); c.line(40,H-86,W-40,H-86)
          def footer(page):
              c.setStrokeColor(LINE); c.line(40,43,W-40,43)
              txt(40,28,"EcoAI Technologies Ltd",6.3,"DVS",GREY)
              c.setFont("DVS",6.3); c.setFillColor(GREY); c.drawCentredString(W/2,28,"www.ecoai.energy"); c.drawRightString(W-40,28,str(page))
          def page_title(eyebrow,title,subtitle):
              txt(42,H-118,eyebrow.upper(),7.3,"DVSB",TEAL)
              txt(42,H-158,title,22.5,"DVSF",NAVY)
              txt(42,H-184,subtitle,10.2,"DVSB",GREY)

          # PAGE 1
          header(True)
          page_title("EcoAI Building Qualification","Building Review & Qualification Guide","How we identify where continuous HVAC optimisation can deliver measurable value")
          rounded(42,H-286,W-84,72,MINT,LINE,7)
          txt(58,H-236,"Business case first. Technical confidence before implementation.",12.0,"DVSF",NAVY)
          wrapped(58,H-258,"The review is designed to establish whether a building offers a credible energy, carbon and commercial opportunity before either party commits significant time or resource.",W-116,8.0,"DVS",GREY,9.5)

          txt(42,H-330,"Why start with a building review?",14.0,"DVSF",NAVY)
          wrapped(42,H-356,"Not every building offers the same opportunity. EcoAI reviews how the building operates, the available energy data and the existing BMS infrastructure so effort is focused where continuous HVAC optimisation is most likely to deliver meaningful, measurable energy savings.",W-84,8.2,"DVS",NAVY,10.0)
          txt(42,H-405,"The objective is not to find buildings that need replacing.",8.8,"DVSB",TEAL)
          txt(42,H-424,"It is to identify buildings where the systems already in place can perform significantly better.",8.8,"DVSB",NAVY)

          txt(42,H-465,"What the initial review considers",14.0,"DVSF",NAVY)
          cw=(W-96)/2; ch=105; gap=14
          cards=[
             ("Commercial opportunity","Is there enough HVAC energy use and avoidable waste to create a meaningful energy and financial case?"),
             ("Existing infrastructure","Can the BMS provide useful HVAC data and allow safe, controlled changes to selected setpoints or offsets? It does not need to be new or sophisticated."),
             ("Measurement","Is there sufficient meter and operating data to understand current performance and verify future energy savings?"),
             ("Operational context","How is the building used, what comfort conditions matter, where does engineering effort go today, and are major changes already planned?")
          ]
          for i,(h,b) in enumerate(cards):
              col=i%2; row=i//2; x=42+col*(cw+gap); y=H-585-row*(ch+18)
              rounded(x,y,cw,ch,MINT if col else LIGHT,LINE,7)
              txt(x+16,y+75,h,9.2,"DVSB",NAVY)
              wrapped(x+16,y+46,b,cw-32,7.0,"DVS",GREY,8.2)
          footer(1); c.showPage()

          # PAGE 2
          header(False)
          page_title("Candidate Building","What makes a strong candidate building?","We look for a combination of opportunity, controllability, evidence and a stable route to value.")
          txt(42,H-226,"Six characteristics matter most",14.0,"DVSF",NAVY)
          items=[
           ("1","Meaningful HVAC energy use","A sufficiently large heating, cooling or ventilation load to create a worthwhile energy-saving opportunity."),
           ("2","Existing BMS infrastructure","A live BMS with useful HVAC data and controllable setpoints or offsets. The existing BMS remains the master control system."),
           ("3","Operational opportunity","Changing schedules, weather response, occupancy, setpoint drift, out-of-hours operation, simultaneous heating/cooling or repeated manual tuning can create scope for continuous optimisation."),
           ("4","Good measurement potential","Suitable meter and operating data make it possible to establish a credible baseline and verify performance."),
           ("5","Reasonably healthy controls and plant","Sensors, valves, dampers, actuators and core control loops should be broadly functional. Optimisation cannot compensate for failed plant or fundamentally broken controls."),
           ("6","A stable operating future","The building is expected to remain in use and is not about to undergo a major change that would make the current assessment obsolete.")
          ]
          cw=(W-96)/2; ch=118; gap=14
          for i,(n,h,b) in enumerate(items):
              col=i%2; row=i//2; x=42+col*(cw+gap); y=H-370-row*(ch+14)
              rounded(x,y,cw,ch,MINT if col else LIGHT,LINE,7)
              c.setFillColor(TEAL); c.circle(x+25,y+93,13,fill=1,stroke=0)
              c.setFillColor(WHITE); c.setFont("DVSB",8.5); c.drawCentredString(x+25,y+90,n)
              wrapped(x+50,y+96,h,cw-66,8.7,"DVSB",NAVY,9.4)
              wrapped(x+16,y+61,b,cw-32,6.8,"DVS",GREY,8.0)
          rounded(42,74,W-84,82,MINT,LINE,7)
          txt(58,129,"A strong candidate is not simply an old or inefficient-looking building.",11.0,"DVSF",NAVY)
          wrapped(58,103,"It is a building with a credible energy and commercial case, useful BMS visibility, controllable HVAC opportunity and enough operational stability to make measurement meaningful.",W-116,7.3,"DVS",GREY,8.6)
          footer(2); c.showPage()

          # PAGE 3
          header(False)
          page_title("Initial Information","What information is useful at the start?","Enough to understand the opportunity - not a full technical survey.")
          rounded(42,H-278,W-84,62,MINT,LINE,7)
          txt(58,H-238,"Approximate information is sufficient for the initial assessment.",10.2,"DVSB",NAVY)
          wrapped(58,H-258,"EcoAI can start with the information available, identify any gaps and agree what is genuinely worth confirming next. The objective is to avoid creating unnecessary work before the opportunity is proven.",W-116,7.2,"DVS",GREY,8.4)
          txt(42,H-316,"Useful initial information",13.5,"DVSF",NAVY)
          bullets=[
            "Building name, location, use and approximate floor area",
            "Annual electricity and heating consumption and, where available, energy cost or unit rates",
            "BMS make, platform/version and BMS/controls contractor if known",
            "Main HVAC systems - for example AHUs, heating circuits, cooling circuits and major plant",
            "Typical operating hours and occupancy patterns",
            "Known comfort, plant or controls issues",
            "Known repeated manual interventions, overrides or tuning requirements",
            "Planned major plant, controls or refurbishment works",
            "Available meter data, interval data and any existing energy reporting"
          ]
          yy=H-345
          for b in bullets:
              c.setFillColor(TEAL); c.circle(47,yy+2,1.8,fill=1,stroke=0)
              txt(57,yy,b,7.3,"DVS",NAVY); yy-=22
          txt(42,H-572,"Who normally helps provide it?",13.5,"DVSF",NAVY)
          roles=[
            ("Estates / FM","Building use, schedules, comfort requirements, operational issues and planned works."),
            ("Energy / sustainability","Consumption data, tariffs, meter information and performance reporting."),
            ("BMS / controls","BMS platform, architecture, point information and likely read/write access route."),
            ("IT / OT","Connectivity and security requirements once a credible building opportunity is identified.")
          ]
          rw=(W-102)/4
          for i,(h,b) in enumerate(roles):
              x=42+i*(rw+6)
              rounded(x,88,rw,118,LIGHT if i%2==0 else MINT,LINE,6)
              wrapped(x+10,180,h,rw-20,8.0,"DVSB",NAVY,9.2)
              wrapped(x+10,146,b,rw-20,6.4,"DVS",GREY,7.4)
          footer(3); c.showPage()

          # PAGE 4
          header(False)
          page_title("Qualification Journey","From initial review to Technical Validation","A clear progression from opportunity to evidence.")
          txt(42,H-226,"The Building Review journey",13.5,"DVSF",NAVY)
          steps=[
            ("1","Initial information","Gather the available building, energy and BMS information."),
            ("2","Desktop assessment","Review the indicative energy, carbon and commercial opportunity using the information available."),
            ("3","Client / engineering review","Confirm assumptions, identify gaps and agree whether the opportunity merits further work."),
            ("4","Technical Validation","Confirm BMS read/write capability, selected control points, control health, metering, comfort limits, secure connectivity and the integration route.")
          ]
          sw=(W-96)/4
          for i,(n,h,b) in enumerate(steps):
              x=42+i*sw
              c.setFillColor(MINT); c.setStrokeColor(LINE); c.rect(x,H-365,sw,H*0+120,fill=1,stroke=1)
              c.setFillColor(TEAL); c.circle(x+18,H-264,10,fill=1,stroke=0)
              c.setFillColor(WHITE); c.setFont("DVSB",7.3); c.drawCentredString(x+18,H-267,n)
              wrapped(x+34,H-259,h,sw-42,7.5,"DVSB",NAVY,8.5)
              wrapped(x+10,H-297,b,sw-20,6.2,"DVS",GREY,7.2)
          sections=[
            ("Desktop assessment","The desktop stage answers a simple question: is there enough evidence of a meaningful opportunity to justify Technical Validation? It is indicative, based on available information, and is not a technical audit or formal offer."),
            ("Client / engineering review","Where the opportunity is credible, EcoAI works with the client and relevant engineering teams to confirm the building context, refine assumptions and establish what additional information is worth gathering."),
            ("Technical Validation","Technical Validation tests the proposed optimisation scope in detail before implementation. It confirms the viable control points, read/write route, core control health, metering, comfort requirements, operating constraints, secure connectivity and deployment route.")
          ]
          yy=H-410
          for h,b in sections:
              txt(42,yy,h,10.0,"DVSB",NAVY)
              yy=wrapped(42,yy-20,b,W-84,7.0,"DVS",GREY,8.4)-20
          rounded(42,76,W-84,86,MINT,LINE,7)
          txt(58,133,"Technical Validation is the bridge between a credible business case and controlled implementation.",9.8,"DVSB",NAVY)
          wrapped(58,111,"It confirms the opportunity before either party commits significant implementation resource.",W-116,7.4,"DVS",GREY,8.5)
          footer(4); c.showPage()

          # PAGE 5
          header(False)
          page_title("Decision","What happens after the review?","A clear recommendation based on the evidence available.")
          txt(42,H-226,"Three possible outcomes",13.5,"DVSF",NAVY)
          cards=[
            ("Proceed to Technical Validation","The energy and commercial opportunity appears strong and there is a credible route to deployment. The next step is to confirm the technical scope and implementation requirements."),
            ("Further information required","The opportunity may be attractive, but additional energy, BMS or operational information is needed before a confident progression decision can be made."),
            ("Not currently suitable","The building does not presently offer a strong enough opportunity, or planned changes mean it is more sensible to pause and revisit later.")
          ]
          cw=(W-96-16)/3
          for i,(h,b) in enumerate(cards):
              x=42+i*(cw+8); rounded(x,H-404,cw,145,MINT if i==0 else LIGHT,LINE,7)
              wrapped(x+14,H-292,h,cw-28,8.2,"DVSB",NAVY,9.2)
              wrapped(x+14,H-330,b,cw-28,6.6,"DVS",GREY,7.5)
          txt(42,H-452,"If the building progresses",13.5,"DVSF",NAVY)
          bullets=[
            "Deployment is planned with the client, BMS/controls and IT/OT teams as required.",
            "myCoreAI is typically deployed remotely with minimal disruption to normal building operations.",
            "The existing BMS remains the master controller; existing plant safeties and local logic remain in place.",
            "Building data is collected so the system can learn how the building behaves.",
            "Selected setpoints and offsets are optimised within agreed comfort and operational limits.",
            "Performance is measured and energy savings are verified against the agreed baseline."
          ]
          yy=H-482
          for b in bullets:
              c.setFillColor(TEAL); c.circle(47,yy+2,1.8,fill=1,stroke=0)
              txt(57,yy,b,6.8,"DVS",NAVY); yy-=22
          rounded(42,72,W-84,108,MINT,LINE,7)
          txt(58,147,"The purpose of the Building Review is simple:",9.8,"DVSB",NAVY)
          wrapped(58,125,"Identify the right buildings, establish the energy and commercial case, and confirm there is a credible technical route before either party commits significant resource.",W-116,7.6,"DVSB",NAVY,9.0)
          txt(58,91,"Business case first. Technical confidence before implementation.",8.5,"DVSB",TEAL)
          footer(5); c.showPage()
          c.save()

      - name: Commit refreshed Building Review PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/docs/ecoai-building-review-and-qualification-guide.pdf
          if git diff --cached --quiet; then
            echo "No Building Review PDF change."
          else
            git commit -m "Refresh Building Review guide PDF"
            git push
          fi
