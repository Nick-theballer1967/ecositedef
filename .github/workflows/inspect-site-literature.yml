name: Inspect website literature PDFs

on:
  push:
    paths:
      - '.github/workflows/inspect-site-literature.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Package and render website PDFs
        shell: python
        run: |
          import fitz, pathlib, shutil
          files = [
              "assets/docs/ecoai-building-review-and-qualification-guide.pdf",
              "assets/docs/ecoai-economics-autonomous-hvac-optimisation.pdf",
              "assets/docs/ecoai-how-hvac-energy-savings-are-delivered.pdf",
              "assets/docs/ecoai-value-proposition-continuous-hvac-optimisation.pdf",
              "assets/ecoai-local-government-case-study.pdf",
              "assets/st-andrews-case-study.pdf",
              "ecoai-electricity-brief.pdf",
          ]
          out = pathlib.Path("site-literature-inspection")
          out.mkdir(exist_ok=True)
          for rel in files:
              src = pathlib.Path(rel)
              stem = src.stem
              shutil.copy2(src, out / src.name)
              doc = fitz.open(src)
              for i, page in enumerate(doc):
                  pix = page.get_pixmap(matrix=fitz.Matrix(1.25,1.25), alpha=False)
                  pix.save(out / f"{stem}-page-{i+1}.png")
              doc.close()
      - uses: actions/upload-artifact@v4
        with:
          name: site-literature-inspection
          path: site-literature-inspection/
          retention-days: 1
