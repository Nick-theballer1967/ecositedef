name: Render HVAC source for review

on:
  push:
    paths:
      - '.github/workflows/render-hvac-source.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Render source PDF
        shell: python
        run: |
          import fitz, pathlib, shutil
          src = pathlib.Path("assets/docs/ecoai-how-hvac-energy-savings-are-delivered.pdf")
          out = pathlib.Path("hvac-source")
          out.mkdir(exist_ok=True)
          shutil.copy2(src, out / "HVAC_Optimisation_in_Practice_ORIGINAL.pdf")
          doc = fitz.open(src)
          for i, page in enumerate(doc):
              pix = page.get_pixmap(matrix=fitz.Matrix(1.8,1.8), alpha=False)
              pix.save(out / f"page-{i+1}.png")
          doc.close()
      - uses: actions/upload-artifact@v4
        with:
          name: hvac-source-inspection
          path: hvac-source/
          retention-days: 1
