name: Audit website literature text

on:
  push:
    paths:
      - '.github/workflows/audit-site-literature.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Extract literature audit
        shell: python
        run: |
          import fitz, pathlib, hashlib
          files = [
              "assets/docs/ecoai-building-review-and-qualification-guide.pdf",
              "assets/docs/ecoai-economics-autonomous-hvac-optimisation.pdf",
              "assets/docs/ecoai-how-hvac-energy-savings-are-delivered.pdf",
              "assets/docs/ecoai-value-proposition-continuous-hvac-optimisation.pdf",
              "assets/ecoai-local-government-case-study.pdf",
              "assets/st-andrews-case-study.pdf",
              "ecoai-electricity-brief.pdf",
          ]
          out = []
          for rel in files:
              p = pathlib.Path(rel)
              data = p.read_bytes()
              out += ["="*80, rel, f"SIZE={len(data)} SHA256={hashlib.sha256(data).hexdigest()}"]
              doc = fitz.open(p)
              for i, page in enumerate(doc):
                  out += [f"--- PAGE {i+1} ---", page.get_text()]
              doc.close()
          pathlib.Path("site-literature-audit.txt").write_text("\n".join(out), encoding="utf-8")
      - name: Commit audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-literature-audit.txt
          git commit -m "Add temporary website literature audit" || exit 0
          git push
