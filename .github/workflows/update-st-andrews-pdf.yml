name: Update St Andrews case study PDF

on:
  push:
    paths:
      - '.github/workflows/update-st-andrews-pdf.yml'

permissions:
  contents: write

jobs:
  update-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: python -m pip install --quiet pymupdf

      - name: Refresh St Andrews PDF
        shell: python
        run: |
          import fitz
          from pathlib import Path

          src = Path("assets/st-andrews-case-study.pdf")
          out = Path("assets/st-andrews-case-study.new.pdf")
          logo_path = Path("assets/logo-primary.png")

          doc = fitz.open(src)

          NAVY = (0x12/255, 0x4D/255, 0x5A/255)
          DARK = (0x11/255, 0x3D/255, 0x46/255)
          GREY = (0x52/255, 0x60/255, 0x68/255)
          TEAL = (0x13/255, 0xA8/255, 0xA0/255)
          PALE = (0xE9/255, 0xF6/255, 0xF5/255)
          PALE2 = (0xF5/255, 0xF9/255, 0xF9/255)
          WHITE = (1, 1, 1)

          def redact(page, rect, fill=WHITE):
              page.add_redact_annot(rect, fill=fill)

          def insert_box(page, rect, text, fontsize=10.85, fontname="helv",
                         color=DARK, align=fitz.TEXT_ALIGN_LEFT, lineheight=1.15):
              return page.insert_textbox(
                  rect, text, fontsize=fontsize, fontname=fontname,
                  color=color, align=align, lineheight=lineheight
              )

          # Page 1
          p = doc[0]
          for r in [
              fitz.Rect(45,18,240,38), fitz.Rect(195,801,405,823), fitz.Rect(48,48,195,126),
              fitz.Rect(52,164,285,190), fitz.Rect(238,249,360,281), fitz.Rect(62,299,533,332),
              fitz.Rect(52,623,545,673), fitz.Rect(52,671,548,733), fitz.Rect(52,732,530,754)
          ]:
              redact(p, r)
          p.apply_redactions()

          p.draw_rect(fitz.Rect(240,250,367,280), color=None, fill=PALE, overlay=True)
          p.draw_rect(fitz.Rect(65,302,530,329), color=None, fill=PALE2, overlay=True)

          insert_box(p, fitz.Rect(48,22,260,36), "EcoAI Technologies | ecoai.energy", 7.6, color=GREY)
          insert_box(p, fitz.Rect(190,805,420,821), "EcoAI Technologies  |  ecoai.energy", 7.4, color=GREY, align=fitz.TEXT_ALIGN_CENTER)

          p.insert_image(fitz.Rect(54,56,178,105), filename=str(logo_path), keep_proportion=True)
          insert_box(
              p, fitz.Rect(54,105,225,124),
              "Dynamic, real-time HVAC optimisation\n- delivering energy savings automatically.",
              6.5, color=GREY, lineheight=1.05
          )

          insert_box(p, fitz.Rect(54,168,330,188), "Dynamic HVAC optimisation case study", 12.5, color=GREY)
          insert_box(
              p, fitz.Rect(238,253,362,278),
              "Measured energy savings\nApril 2025 - April 2026",
              8.3, "hebo", NAVY, fitz.TEXT_ALIGN_CENTER, 1.08
          )
          insert_box(
              p, fitz.Rect(68,304,526,329),
              "Annualised performance at time of reporting: 207 MWh/year | £19.4k/year gross benefit | "
              "approx. £15k/year net after annual subscription | 38.4 tCO2e/year",
              8.4, "hebo", NAVY, fitz.TEXT_ALIGN_CENTER, 1.05
          )
          insert_box(
              p, fitz.Rect(54,627,538,673),
              "Measured energy savings over the period total approximately 158 MWh, comprising "
              "25,896 kWh of HVAC electricity reduction and 132,218 kWh of heat reduction. "
              "This equates to approximately £14.4k of gross financial benefit, or approximately "
              "£10.4k net benefit after the annual subscription of c£4k.",
              10.55, color=DARK, lineheight=1.10
          )
          insert_box(
              p, fitz.Rect(54,675,540,731),
              "Performance strengthened as myCoreAI learned the building and full control was established. "
              "At the time of reporting, annualised performance was equivalent to approximately 207 MWh/year, "
              "delivering around £19.4k/year of gross financial benefit and approximately £15k/year net benefit "
              "after annual subscription.",
              10.25, color=DARK, lineheight=1.10
          )
          insert_box(
              p, fitz.Rect(54,735,535,754),
              "Energy savings were delivered without sacrificing comfort or disrupting building operations.",
              10.55, color=DARK
          )

          # Page 2
          p = doc[1]
          for r in [
              fitz.Rect(45,18,240,38), fitz.Rect(195,801,405,823),
              fitz.Rect(53,566,540,585)
          ]:
              redact(p, r)
          p.apply_redactions()
          p.draw_rect(fitz.Rect(54,568,539,583), color=None, fill=PALE2, overlay=True)

          insert_box(p, fitz.Rect(48,22,260,36), "EcoAI Technologies | ecoai.energy", 7.6, color=GREY)
          insert_box(p, fitz.Rect(190,805,420,821), "EcoAI Technologies  |  ecoai.energy", 7.4, color=GREY, align=fitz.TEXT_ALIGN_CENTER)
          insert_box(p, fitz.Rect(54,568,205,584), "Total measured energy saving", 9.0, "hebo", NAVY)
          insert_box(p, fitz.Rect(209,568,535,584), "158,114 kWh saved", 9.0, color=DARK)

          # Page 3
          p = doc[2]
          for r in [
              fitz.Rect(45,18,240,38), fitz.Rect(195,801,405,823),
              fitz.Rect(52,147,545,195), fitz.Rect(52,261,535,296),
              fitz.Rect(52,295,525,316), fitz.Rect(48,690,548,792)
          ]:
              redact(p, r)
          p.apply_redactions()

          insert_box(p, fitz.Rect(48,22,260,36), "EcoAI Technologies | ecoai.energy", 7.6, color=GREY)
          insert_box(p, fitz.Rect(190,805,420,821), "EcoAI Technologies  |  ecoai.energy", 7.4, color=GREY, align=fitz.TEXT_ALIGN_CENTER)
          insert_box(
              p, fitz.Rect(54,151,538,194),
              "myCoreAI was deployed as an optimisation layer alongside the existing BMS. The Desigo system "
              "continued to control the mechanical plant, while myCoreAI adjusted operating setpoints through "
              "15-minute optimisation cycles based on live building conditions and forecast weather conditions.",
              10.65, color=DARK, lineheight=1.12
          )
          p.draw_line(fitz.Point(48,260), fitz.Point(548,260), color=TEAL, width=0.8, overlay=True)
          insert_box(
              p, fitz.Rect(54,265,530,296),
              "Using UK Government 2025 conversion factors for grid electricity and mains gas, measured "
              "savings to date equate to an estimated operational carbon reduction of 29.26 tCO2e.",
              10.55, color=DARK, lineheight=1.10
          )
          insert_box(
              p, fitz.Rect(54,299,530,317),
              "At the annualised position reported in the original case study, this equated to approximately 38.4 tCO2e/year.",
              9.8, color=DARK
          )

          box = fitz.Rect(54,698,541,783)
          p.draw_rect(box, color=TEAL, fill=PALE, width=1.0, overlay=True)
          p.draw_rect(fitz.Rect(54,698,59,783), color=TEAL, fill=TEAL, width=0, overlay=True)
          insert_box(p, fitz.Rect(70,707,520,724), "PERFORMANCE UPDATE", 8.2, "hebo", TEAL)
          insert_box(
              p, fitz.Rect(70,725,522,763),
              "Subsequent electricity performance continued to strengthen. A later 12-month view "
              "(July 2025 - June 2026) showed a 26.3% reduction in HVAC electricity consumption "
              "(30.1 MWh), while the September 2025 - June 2026 period showed a 31.5% reduction "
              "(29.2 MWh).",
              9.2, color=DARK, lineheight=1.10
          )
          insert_box(
              p, fitz.Rect(70,763,522,778),
              "EcoAI performance update - outside the original approved April 2025 - April 2026 case-study reporting period.",
              7.2, color=GREY
          )

          doc.save(out, garbage=4, deflate=True)
          doc.close()
          out.replace(src)

      - name: Commit refreshed PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/st-andrews-case-study.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Refresh St Andrews case study PDF"
            git push
          fi
