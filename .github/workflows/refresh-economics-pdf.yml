name: Refresh Economics PDF

on:
  push:
    paths:
      - '.github/workflows/refresh-economics-pdf.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet reportlab pillow
      - name: Generate refreshed Economics PDF
        shell: python
        run: |
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.colors import HexColor, white
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.pdfbase import pdfmetrics
          from reportlab.lib.utils import ImageReader
          from reportlab.pdfbase.pdfmetrics import stringWidth
          from pathlib import Path

          out = Path("assets/docs/ecoai-economics-autonomous-hvac-optimisation.pdf")
          logo = Path("assets/logo-primary.png")
          W, H = A4

          font_dir = "/usr/share/fonts/truetype/dejavu"
          pdfmetrics.registerFont(TTFont("DVSans", f"{font_dir}/DejaVuSans.ttf"))
          pdfmetrics.registerFont(TTFont("DVSans-Bold", f"{font_dir}/DejaVuSans-Bold.ttf"))

          NAVY = HexColor("#0F5C68")
          DARK = HexColor("#26343A")
          TEAL = HexColor("#16B7A8")
          GREY = HexColor("#667A82")
          LIGHT = HexColor("#F4F8F8")
          MINT = HexColor("#E9F5F4")
          LINE = HexColor("#B7D7D4")
          PURPLE = HexColor("#7355D9")
          WHITE = white

          c = canvas.Canvas(str(out), pagesize=A4)

          def txt(x, y, s, size=9, font="DVSans", color=DARK):
              c.setFillColor(color); c.setFont(font, size); c.drawString(x, y, s)

          def centered(xc, y, s, size=9, font="DVSans", color=DARK):
              c.setFillColor(color); c.setFont(font, size); c.drawCentredString(xc, y, s)

          def wrap_lines(text, font, size, maxw):
              words = text.split(); lines = []; cur = ""
              for w in words:
                  t = w if not cur else cur + " " + w
                  if stringWidth(t, font, size) <= maxw:
                      cur = t
                  else:
                      if cur: lines.append(cur)
                      cur = w
              if cur: lines.append(cur)
              return lines

          def wrapped(x, y, text, maxw, size=8, font="DVSans", color=DARK, leading=None):
              if leading is None: leading = size * 1.2
              c.setFillColor(color); c.setFont(font, size)
              yy = y
              for line in wrap_lines(text, font, size, maxw):
                  c.drawString(x, yy, line); yy -= leading
              return yy

          def rounded(x, y, w, h, fill=LIGHT, stroke=LINE, r=5, lw=0.7):
              c.setFillColor(fill); c.setStrokeColor(stroke); c.setLineWidth(lw)
              c.roundRect(x, y, w, h, r, fill=1, stroke=1)

          def header(label, first=False):
              c.drawImage(ImageReader(str(logo)), 56, H-105, width=130, height=48, preserveAspectRatio=True, mask="auto")
              if first:
                  txt(58, H-114, "Dynamic, real-time HVAC optimisation", 6.1, "DVSans-Bold", TEAL)
                  txt(58, H-124, "- delivering energy savings automatically.", 6.1, "DVSans", GREY)
              c.setFont("DVSans-Bold", 7.5); c.setFillColor(NAVY)
              c.drawRightString(W-58, H-65, label)
              c.setStrokeColor(TEAL); c.setLineWidth(1.3)
              c.line(55, H-138, W-55, H-138)

          def footer(label, page_no):
              txt(60, 39, "EcoAI Technologies Ltd", 6.2, "DVSans", GREY)
              centered(W/2, 39, label, 6.2, "DVSans", GREY)
              c.setFont("DVSans", 6.2); c.setFillColor(GREY)
              c.drawRightString(W-60, 39, f"www.ecoai.energy   |   {page_no}")

          # PAGE 1
          header("COMMERCIAL INSIGHT", first=True)
          txt(55, H-173, "The Economics of Autonomous", 23, "DVSans-Bold", NAVY)
          txt(55, H-205, "HVAC Optimisation", 23, "DVSans-Bold", NAVY)
          txt(55, H-234, "Increasing engineering capacity without increasing engineering headcount.", 10.0, "DVSans", DARK)
          txt(55, H-270, "What is missing from the optimisation business case?", 12.3, "DVSans-Bold", NAVY)

          rounded(55, H-352, W-110, 65, fill=MINT, stroke=LINE)
          txt(64, H-312, "Energy savings are only half the equation.", 13.0, "DVSans-Bold", NAVY)
          wrapped(64, H-330,
              "Most optimisation propositions focus on the value of the energy saved. Far less attention is given to the cost of the engineering resource required to create, implement and preserve those savings.",
              W-128, 7.8, "DVSans", DARK, 9.5)

          box_y = H-438; box_h = 72; colw = (W-110)/3
          steps = [
              ("1  Identify", "Analytics can identify where energy is being wasted and where improvement may be possible."),
              ("2  Deliver", "An engineer still has to investigate recommendations, change the BMS and check the outcome."),
              ("3  Sustain", "As weather, occupancy and building behaviour change, optimisation has to continue.")
          ]
          for i,(head,body) in enumerate(steps):
              x = 55 + i*colw
              c.setFillColor(LIGHT); c.setStrokeColor(LINE); c.setLineWidth(0.6)
              c.rect(x, box_y, colw, box_h, fill=1, stroke=1)
              txt(x+8, box_y+52, head, 9.4, "DVSans-Bold", NAVY)
              wrapped(x+8, box_y+37, body, colw-16, 6.8, "DVSans", DARK, 8.2)

          txt(55, H-490, "A better commercial equation", 12.3, "DVSans-Bold", NAVY)
          eq_y = H-586; eq_h = 74; eq_w = (W-110)/2
          rounded(55, eq_y, eq_w, eq_h, fill=WHITE, stroke=LINE, r=0)
          txt(64, eq_y+54, "Apparent return", 9.5, "DVSans-Bold", NAVY)
          txt(64, eq_y+37, "Energy savings - software / project cost", 8.2, "DVSans-Bold", NAVY)
          wrapped(64, eq_y+21,
              "This can overlook the internal or external engineering time needed to turn recommendations into sustained performance.",
              eq_w-18, 6.4, "DVSans", DARK, 7.6)

          rounded(55+eq_w, eq_y, eq_w, eq_h, fill=MINT, stroke=LINE, r=0)
          txt(64+eq_w, eq_y+54, "True optimisation economics", 9.5, "DVSans-Bold", NAVY)
          txt(64+eq_w, eq_y+37, "Verified energy savings - total cost of delivery", 8.1, "DVSans-Bold", TEAL)
          wrapped(64+eq_w, eq_y+21,
              "This includes the engineering resource required to implement, monitor and continually sustain the optimisation.",
              eq_w-18, 6.4, "DVSans", DARK, 7.6)

          centered(W/2, H-620, "It is not engineering replacement. It is engineering leverage.", 10.7, "DVSans-Bold", NAVY)
          footer("COMMERCIAL INSIGHT", 1)
          c.showPage()

          # PAGE 2
          header("THE MISSING COST")
          txt(55, H-173, "What does it cost to deliver and sustain", 21.0, "DVSans-Bold", NAVY)
          txt(55, H-200, "the energy savings?", 21.0, "DVSans-Bold", NAVY)
          wrapped(55, H-230,
              "A predicted energy opportunity is not the same thing as a realised energy saving. Someone still has to deliver and sustain it.",
              W-110, 9.2, "DVSans", DARK, 11)
          txt(55, H-270, "The engineering work behind the headline number", 12.3, "DVSans-Bold", NAVY)

          grid_y = H-420; grid_h = 130; cell_w = (W-110)/2; cell_h = grid_h/3
          work = [
              ("Review the data","Understand trends, loads and operating behaviour."),
              ("Investigate recommendations","Decide what can safely and practically change."),
              ("Modify the BMS","Adjust strategies, schedules, setpoints or control parameters."),
              ("Check the result","Confirm that the intervention delivered the expected effect."),
              ("Revisit the building","Respond as seasons, occupancy and plant conditions change."),
              ("Repeat across the estate","Scale the same process across multiple buildings and systems.")
          ]
          for i,(head,body) in enumerate(work):
              col = i % 2; row = i // 2
              x = 55 + col*cell_w; y = grid_y + (2-row)*cell_h
              c.setFillColor(LIGHT); c.setStrokeColor(LINE); c.setLineWidth(0.6)
              c.rect(x, y, cell_w, cell_h, fill=1, stroke=1)
              txt(x+8, y+28, head, 8.2, "DVSans-Bold", NAVY)
              wrapped(x+8, y+14, body, cell_w-16, 6.3, "DVSans", DARK, 7.4)

          wrapped(55, H-447,
              "That time has a cost whether it is provided by an internal estates team, an FM provider, a BMS contractor or an external optimisation consultant.",
              W-110, 8.4, "DVSans-Bold", NAVY, 10)
          txt(55, H-490, "Autonomous optimisation changes the equation", 12.3, "DVSans-Bold", NAVY)

          tbl_y = H-635; tbl_h = 125; half = (W-110)/2
          rounded(55, tbl_y+tbl_h-34, half, 34, fill=MINT, stroke=LINE, r=0)
          rounded(55+half, tbl_y+tbl_h-34, half, 34, fill=MINT, stroke=LINE, r=0)
          centered(55+half/2, tbl_y+tbl_h-22, "Analytics / periodic optimisation", 8.4, "DVSans-Bold", NAVY)
          centered(55+half+half/2, tbl_y+tbl_h-22, "Autonomous optimisation", 8.4, "DVSans-Bold", NAVY)
          rounded(55, tbl_y+38, half, tbl_h-72, fill=WHITE, stroke=LINE, r=0)
          rounded(55+half, tbl_y+38, half, tbl_h-72, fill=WHITE, stroke=LINE, r=0)
          wrapped(63, tbl_y+tbl_h-54,
              "Identifies opportunities and supports the engineer. The ongoing energy saving depends on someone reviewing, implementing and revisiting the optimisation.",
              half-16, 6.7, "DVSans", DARK, 8.0)
          wrapped(63+half, tbl_y+tbl_h-54,
              "myCoreAI continuously analyses live building conditions alongside current and forecast weather, then adjusts selected HVAC setpoints and offsets through the existing BMS every 15 minutes within agreed limits. The BMS remains master.",
              half-16, 6.4, "DVSans", DARK, 7.6)
          rounded(55, tbl_y, W-110, 38, fill=MINT, stroke=LINE, r=0)
          wrapped(64, tbl_y+24,
              "The optimisation workload is built into the service rather than added to the client's engineering workload.",
              W-128, 8.3, "DVSans-Bold", NAVY, 9.3)

          txt(55, H-674, "Why this matters at estate scale", 12.3, "DVSans-Bold", NAVY)
          wrapped(55, H-695,
              "More buildings normally mean more data to review, more interventions to make and more performance to monitor. Eventually, sustaining optimisation becomes a resource problem as much as an energy problem. Autonomous optimisation allows the optimisation workload to scale without requiring a proportional increase in engineering headcount.",
              W-110, 7.4, "DVSans", DARK, 9.0)
          footer("THE MISSING COST", 2)
          c.showPage()

          # PAGE 3
          header("ENGINEERING CAPACITY")
          txt(55, H-173, "Engineering leverage, not engineering", 21.0, "DVSans-Bold", NAVY)
          txt(55, H-200, "replacement", 21.0, "DVSans-Bold", NAVY)
          txt(55, H-228, "BMS engineers remain essential. Autonomous optimisation changes how their expertise is used.", 9.2, "DVSans", DARK)

          cards_y = H-348; cards_h = 82; cw = (W-110)/3
          cards = [
              ("Engineers remain essential","Faults, diagnostics, commissioning, BMS infrastructure, upgrades, controls strategy and complex engineering decisions still require skilled people."),
              ("myCoreAI handles the repetition","The system continuously analyses conditions and adjusts selected HVAC parameters every 15 minutes, 24/7, within agreed limits."),
              ("The estate gains capacity","Existing engineers can focus on work that genuinely needs engineering judgement instead of spending valuable time on continual routine retuning.")
          ]
          for i,(head,body) in enumerate(cards):
              x=55+i*cw
              c.setFillColor(LIGHT); c.setStrokeColor(LINE); c.setLineWidth(0.6)
              c.rect(x,cards_y,cw,cards_h,fill=1,stroke=1)
              wrapped(x+8,cards_y+58,head,cw-16,8.3,"DVSans-Bold",NAVY,9.4)
              wrapped(x+8,cards_y+31,body,cw-16,6.2,"DVSans",DARK,7.1)

          txt(55, H-375, "Evidence in operation: University of St Andrews", 12.3, "DVSans-Bold", NAVY)
          wrapped(55, H-398,
              "At the Scottish Oceans Institute, myCoreAI was introduced through the existing BMS while the university retained its own BMS engineering capability. Over the first 12 months, the project delivered measured energy reductions while the engineering team remained responsible for the building systems and work requiring human expertise.",
              W-110, 7.3, "DVSans", DARK, 8.8)

          metrics_y = H-495; mw = (W-110)/4
          metrics = [
              ("158 MWh","energy reduction",TEAL),
              ("21%","HVAC electricity",TEAL),
              ("9%","heat reduction",HexColor("#00A879")),
              ("29.3 tCO2e","carbon reduction",PURPLE)
          ]
          for i,(val,label,col) in enumerate(metrics):
              x=55+i*mw
              c.setFillColor(LIGHT); c.setStrokeColor(LINE); c.setLineWidth(0.6)
              c.rect(x,metrics_y,mw,52,fill=1,stroke=1)
              centered(x+mw/2,metrics_y+29,val,13.0,"DVSans-Bold",col)
              centered(x+mw/2,metrics_y+14,label,6.3,"DVSans-Bold",DARK)

          txt(55, H-528, "The university still needs BMS engineers. That is precisely the point.", 8.6, "DVSans-Bold", NAVY)
          wrapped(55, H-545,
              "Autonomous optimisation does not remove engineering expertise; it means that expertise does not have to be consumed by continuous routine optimisation.",
              W-110, 7.1, "DVSans", DARK, 8.4)

          txt(55, H-585, "How optimisation should now be evaluated", 12.3, "DVSans-Bold", NAVY)
          qs = [
              "How much energy can the solution demonstrably save?",
              "How much ongoing engineering input is required to deliver those energy savings?",
              "Does optimisation continue automatically as conditions change?",
              "Can the approach scale across an estate without proportionally scaling headcount?",
              "Are the energy savings evaluated after the full cost of delivery is considered?"
          ]
          qy = H-627; row_h=29
          for i,q in enumerate(qs):
              fill = LIGHT if i%2==0 else WHITE
              c.setFillColor(fill); c.setStrokeColor(LINE); c.setLineWidth(0.5)
              c.rect(55,qy-row_h,W-110,row_h,fill=1,stroke=1)
              txt(63,qy-19,f"{i+1}.",7.1,"DVSans-Bold",TEAL)
              txt(78,qy-19,q,7.1,"DVSans-Bold",NAVY)
              qy -= row_h

          rounded(55, qy-52, W-110, 52, fill=MINT, stroke=LINE, r=0)
          centered(W/2, qy-22,
              "The cost of continuous optimisation is built into the solution rather than hidden in engineering resource.",
              8.8, "DVSans-Bold", NAVY)
          centered(W/2, qy-37, "That is the commercial difference.", 8.0, "DVSans-Bold", TEAL)
          footer("ENGINEERING CAPACITY", 3)
          c.showPage()
          c.save()

      - name: Commit refreshed Economics PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/docs/ecoai-economics-autonomous-hvac-optimisation.pdf
          if git diff --cached --quiet; then
            echo "No Economics PDF change."
          else
            git commit -m "Refresh Economics briefing PDF"
            git push
          fi
