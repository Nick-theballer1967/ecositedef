name: Refresh Controls Overview PDF

on:
  push:
    paths:
      - '.github/workflows/refresh-controls-overview-pdf.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet reportlab pillow
      - name: Generate refreshed Controls Overview
        shell: python
        run: |
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import landscape, A4
          from reportlab.lib.colors import HexColor, white
          from reportlab.pdfbase.ttfonts import TTFont
          from reportlab.pdfbase import pdfmetrics
          from reportlab.lib.utils import ImageReader
          from reportlab.pdfbase.pdfmetrics import stringWidth
          from pathlib import Path

          out=Path("assets/docs/ecoai-value-proposition-continuous-hvac-optimisation.pdf")
          logo=Path("assets/logo-primary.png")
          W,H=landscape(A4)
          fd="/usr/share/fonts/truetype/dejavu"
          pdfmetrics.registerFont(TTFont("DVS",f"{fd}/DejaVuSans.ttf"))
          pdfmetrics.registerFont(TTFont("DVSB",f"{fd}/DejaVuSans-Bold.ttf"))
          pdfmetrics.registerFont(TTFont("DVSF",f"{fd}/DejaVuSerif-Bold.ttf"))

          NAVY=HexColor("#123E4A"); TEAL=HexColor("#0B918A"); GREY=HexColor("#6D7D84")
          PALE=HexColor("#E8F5F3"); PALE2=HexColor("#D8EFED"); LINE=HexColor("#AFD7D2"); WHITE=white
          c=canvas.Canvas(str(out),pagesize=(W,H))

          def txt(x,y,s,size=9,font="DVS",color=NAVY):
              c.setFillColor(color); c.setFont(font,size); c.drawString(x,y,s)
          def centered(x,y,s,size=9,font="DVS",color=NAVY):
              c.setFillColor(color); c.setFont(font,size); c.drawCentredString(x,y,s)
          def wrap(s,font,size,maxw):
              words=s.split(); lines=[]; cur=""
              for w in words:
                  t=w if not cur else cur+" "+w
                  if stringWidth(t,font,size)<=maxw: cur=t
                  else:
                      if cur: lines.append(cur)
                      cur=w
              if cur: lines.append(cur)
              return lines
          def wrapped(x,y,s,maxw,size=8,font="DVS",color=GREY,leading=None):
              if leading is None: leading=size*1.15
              c.setFont(font,size); c.setFillColor(color); yy=y
              for line in wrap(s,font,size,maxw):
                  c.drawString(x,yy,line); yy-=leading
              return yy
          def rounded(x,y,w,h,fill=PALE,stroke=LINE,r=6):
              c.setFillColor(fill); c.setStrokeColor(stroke); c.setLineWidth(.7)
              c.roundRect(x,y,w,h,r,fill=1,stroke=1)
          def flowbox(x,y,w,h,head,sub):
              rounded(x,y,w,h,HexColor("#F4F8F8"),LINE,5)
              centered(x+w/2,y+h-22,head,6.8,"DVSB",NAVY)
              centered(x+w/2,y+9,sub,5.4,"DVS",GREY)

          # Header
          c.drawImage(ImageReader(str(logo)),48,H-74,width=130,height=49,preserveAspectRatio=True,mask="auto")
          txt(183,H-41,"Dynamic, real-time HVAC optimisation",7.2,"DVSB",TEAL)
          txt(183,H-54,"delivering energy savings automatically.",7.0,"DVS",GREY)
          c.setFont("DVSB",6.8); c.setFillColor(TEAL); c.drawRightString(W-50,H-35,"ECOAI | VALUE PROPOSITION")
          c.setFont("DVS",7.3); c.setFillColor(GREY); c.drawRightString(W-50,H-50,"CONTINUOUS HVAC OPTIMISATION")
          c.setFont("DVS",6.6); c.drawRightString(W-50,H-65,"Existing BMS   •   Every 15 minutes   •   24/7")

          # Hero
          hero_y=H-218
          c.setFillColor(PALE2); c.roundRect(34,hero_y,W-68,110,6,fill=1,stroke=0)
          c.setFillColor(TEAL); c.rect(34,hero_y,5,110,fill=1,stroke=0)
          txt(51,hero_y+69,"More data isn't the constraint.",22,"DVSF",NAVY)
          txt(51,hero_y+39,"Turning it into action is.",22,"DVSF",NAVY)
          wrapped(51,hero_y+17,"Continuous HVAC optimisation reduces the time and engineering effort needed to turn building data into measurable energy performance.",500,7.6,"DVS",GREY,8.7)
          c.setStrokeColor(WHITE); c.setLineWidth(1); c.line(565,hero_y,565,hero_y+110)
          centered(690,hero_y+76,"THE PRINCIPLE",7.2,"DVSB",TEAL)
          centered(690,hero_y+50,"The engineer stays in control.",12.0,"DVSF",NAVY)
          centered(690,hero_y+28,"EcoAI automates repetitive optimisation",7.8,"DVS",NAVY)
          centered(690,hero_y+17,"work in the background.",7.8,"DVS",NAVY)

          # Three value cards
          vy=H-294; total=W-68; cw=total/3
          vals=[
             ("LESS TIME","spent on repetitive HVAC tuning","routine optimisation continues in the background"),
             ("MORE SCALE","optimisation across more buildings","without proportionately more engineering resource"),
             ("BETTER OUTCOMES","verified energy savings for building operators","measurable energy, carbon and comfort performance")
          ]
          for i,(h,s,n) in enumerate(vals):
              x=34+i*cw; c.setFillColor(PALE); c.roundRect(x,vy,cw-2,58,5,fill=1,stroke=0)
              txt(x+58,vy+38,h,10.5,"DVSF",TEAL)
              txt(x+58,vy+24,s,6.6,"DVSB",NAVY)
              txt(x+58,vy+10,n,5.8,"DVS",GREY)
              c.setFillColor(TEAL); c.circle(x+23,vy+29,14,fill=1,stroke=0)

          # Lower left
          leftx=34; leftw=470
          txt(leftx,H-335,"FROM INSIGHT TO ACTION",6.6,"DVSB",TEAL)
          c.setStrokeColor(TEAL); c.line(leftx+118,H-333,leftx+151,H-333)
          txt(leftx,H-358,"The hidden cost is the work between identifying an opportunity",12.0,"DVSF",NAVY)
          txt(leftx,H-374,"and delivering the energy saving.",12.0,"DVSF",NAVY)
          txt(leftx,H-390,"TODAY",6.3,"DVSB",TEAL)

          bx=leftx; by=H-446; gap=13; bw=72; bh=38
          today=[
             ("DATA +\nANALYTICS","identify"),("ENGINEER\nINTERPRETS","review"),("DECIDE +\nADJUST","act"),
             ("CONDITIONS\nCHANGE","weather / use"),("REPEAT","again")
          ]
          for i,(h,s) in enumerate(today):
              x=bx+i*(bw+gap); flowbox(x,by,bw,bh,h,s)
              if i<4: txt(x+bw+4,by+17,"→",13,"DVSB",TEAL)
          txt(leftx,by-20,"Every cycle consumes skilled engineering time.",7.8,"DVSF",NAVY)

          txt(leftx,by-46,"WITH ECOAI",6.3,"DVSB",TEAL)
          bw2=86; gap2=18; by2=by-92
          eco=[
             ("LIVE DATA +\nWEATHER","continuous"),("OPTIMISE\nEVERY 15 MIN","automatic"),
             ("BMS REMAINS\nMASTER","applies within agreed limits"),("ENGINEER\nOVERSEES","in control")
          ]
          for i,(h,s) in enumerate(eco):
              x=bx+i*(bw2+gap2); flowbox(x,by2,bw2,bh,h,s)
              if i<3: txt(x+bw2+4,by2+17,"→",13,"DVSB",TEAL)
          txt(leftx,by2-20,"Routine optimisation continues 24/7 within agreed comfort conditions.",7.8,"DVSF",NAVY)

          # Lower right
          rx=538
          txt(rx,H-335,"WHAT THIS ENABLES",6.6,"DVSB",TEAL)
          c.setStrokeColor(TEAL); c.line(rx+103,H-333,rx+136,H-333)
          txt(rx,H-358,"More optimisation capacity. Stronger",12.0,"DVSF",NAVY)
          txt(rx,H-374,"building outcomes.",12.0,"DVSF",NAVY)
          bullets=[
            "Extends optimisation without proportionately increasing engineering resource.",
            "Complements existing BMS, analytics and energy-management services.",
            "Frees engineering time for faults, maintenance and complex plant issues.",
            "Provides verified savings evidence for reporting, investment and rollout."
          ]
          yy=H-405
          for b in bullets:
              c.setFillColor(TEAL); c.circle(rx+3,yy+2,2.3,fill=1,stroke=0)
              txt(rx+14,yy,b,6.0,"DVS",GREY); yy-=14

          # Owner value box
          rounded(rx,H-520,W-rx-34,62,PALE2,LINE,4)
          c.setFillColor(TEAL); c.rect(rx,H-520,4,62,fill=1,stroke=0)
          txt(rx+48,H-476,"VALUE FOR BUILDING OWNERS & OPERATORS",6.5,"DVSB",TEAL)
          txt(rx+48,H-494,"Lower energy use and cost. Lower",10.2,"DVSF",NAVY)
          txt(rx+48,H-508,"carbon. More consistent comfort.",10.2,"DVSF",NAVY)
          txt(rx+48,H-520+8,"Less operational effort - with no rip-and-replace of the existing controls.",5.6,"DVS",GREY)

          # Footer strip
          c.setFillColor(PALE); c.rect(34,18,W-68,26,fill=1,stroke=0)
          txt(44,27,"Support the engineer. Automate the repetitive work. Deliver energy savings continuously.",7.5,"DVSF",NAVY)
          c.setFont("DVS",5.6); c.setFillColor(GREY); c.drawRightString(W-46,27,"ecoai.energy  |  Nick Kirby")

          c.save()

      - name: Commit refreshed Controls Overview PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/docs/ecoai-value-proposition-continuous-hvac-optimisation.pdf
          if git diff --cached --quiet; then
            echo "No Controls Overview PDF change."
          else
            git commit -m "Refresh Controls and Engineering overview PDF"
            git push
          fi
