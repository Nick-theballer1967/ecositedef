name: Refresh HVAC Optimisation Practice PDF

on:
  push:
    paths:
      - '.github/workflows/refresh-hvac-practice-pdf.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Refresh HVAC practice PDF
        shell: python
        run: |
          import fitz, pathlib
          src = pathlib.Path("assets/docs/ecoai-how-hvac-energy-savings-are-delivered.pdf")
          out = pathlib.Path("assets/docs/ecoai-how-hvac-energy-savings-are-delivered.new.pdf")
          doc = fitz.open(src)

          TEAL=(0.043,0.569,0.541)
          NAVY=(0.071,0.243,0.290)
          GREY=(0.427,0.490,0.518)
          PALE=(0.957,0.976,0.976)
          LINE=(0.686,0.843,0.824)
          WHITE=(1,1,1)

          p=doc[0]
          # Add the current strapline beside the header logo.
          p.draw_rect(fitz.Rect(180,42,385,86), color=WHITE, fill=WHITE, width=0, overlay=True)
          p.insert_textbox(fitz.Rect(182,49,382,65),
              "Dynamic, real-time HVAC optimisation",
              fontsize=7.0,fontname="hebo",color=TEAL,overlay=True)
          p.insert_textbox(fitz.Rect(182,66,382,82),
              "delivering energy savings automatically.",
              fontsize=6.7,fontname="helv",color=GREY,overlay=True)

          # Replace the old automatic-optimisation box with engineer-support wording.
          hits=p.search_for("Automatic optimisation - no manual intervention")
          if hits:
              y0=hits[0].y0-10
          else:
              y0=694
          y1=782
          p.draw_rect(fitz.Rect(48,y0,548,y1), color=WHITE, fill=WHITE, width=0, overlay=True)
          p.draw_rect(fitz.Rect(48,y0,548,y1), color=LINE, fill=PALE, width=.7, overlay=True)
          p.insert_textbox(fitz.Rect(63,y0+14,530,y0+31),
              "Supporting engineering teams",
              fontsize=9.7,fontname="hebo",color=NAVY,overlay=True)
          p.insert_textbox(fitz.Rect(63,y0+35,530,y0+62),
              "Continuous routine optimisation continues automatically in the background, allowing skilled BMS and estates teams to focus on faults, projects, commissioning, upgrades and work that genuinely requires engineering expertise.",
              fontsize=6.8,fontname="helv",color=GREY,lineheight=1.05,overlay=True)
          p.insert_textbox(fitz.Rect(63,y0+64,530,y0+80),
              "BMS remains master - selected setpoints and offsets optimised every 15 minutes - agreed operating limits remain in place",
              fontsize=6.4,fontname="hebo",color=NAVY,overlay=True)

          # Page 3: pluralise the client-facing conclusion.
          p=doc[2]
          matches=p.search_for("Less unnecessary airflow. Stable temperature. Low CO")
          if matches:
              r=matches[0]
              rr=fitz.Rect(48,r.y0-4,548,r.y1+10)
              p.add_redact_annot(rr,fill=WHITE)
              p.apply_redactions()
              p.insert_textbox(rr,
                  "Less unnecessary airflow. Stable temperature. Low CO2. That is where the HVAC energy savings come from.",
                  fontsize=7.6,fontname="hebo",color=NAVY,align=fitz.TEXT_ALIGN_CENTER,overlay=True)

          doc.save(out,garbage=4,deflate=True)
          doc.close()
          out.replace(src)

      - name: Commit refreshed HVAC practice PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/docs/ecoai-how-hvac-energy-savings-are-delivered.pdf
          if git diff --cached --quiet; then
            echo "No HVAC practice PDF change."
          else
            git commit -m "Refresh HVAC Optimisation in Practice PDF"
            git push
          fi
