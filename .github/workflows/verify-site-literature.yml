name: Verify website literature alignment

on:
  push:
    paths:
      - '.github/workflows/verify-site-literature.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pymupdf
      - name: Verify PDF text
        shell: python
        run: |
          import fitz, pathlib, hashlib
          files = [
            "assets/docs/ecoai-building-review-and-qualification-guide.pdf",
            "assets/docs/ecoai-economics-autonomous-hvac-optimisation.pdf",
            "assets/docs/ecoai-how-hvac-energy-savings-are-delivered.pdf",
            "assets/docs/ecoai-value-proposition-continuous-hvac-optimisation.pdf",
            "assets/ecoai-building-review-and-qualification-guide.pdf",
            "assets/ecoai-local-government-case-study.pdf",
            "assets/st-andrews-case-study.pdf",
            "ecoai-electricity-brief.pdf",
          ]
          bad_terms = [
            "Optimise. Operate. Outperform.",
            "Remote access gateway status",
            "Confirm remote access route",
          ]
          lines=[]
          for rel in files:
              p=pathlib.Path(rel)
              doc=fitz.open(p)
              text="\n".join(page.get_text() for page in doc)
              doc.close()
              found=[t for t in bad_terms if t.lower() in text.lower()]
              lines.append(f"{rel}\n  pages={fitz.open(p).page_count} size={p.stat().st_size} sha256={hashlib.sha256(p.read_bytes()).hexdigest()}\n  retired_terms={found or 'NONE'}")
          for html in ["economics.html","technical-assurance.html"]:
              text=pathlib.Path(html).read_text(encoding="utf-8")
              found=[t for t in bad_terms if t.lower() in text.lower()]
              lines.append(f"{html}\n  retired_terms={found or 'NONE'}")
          pathlib.Path("site-literature-verification.txt").write_text("\n\n".join(lines),encoding="utf-8")
      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-literature-verification.txt
          git commit -m "Add temporary website literature verification" || exit 0
          git push
