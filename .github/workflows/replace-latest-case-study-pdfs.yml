name: Replace latest case-study PDFs

on:
  push:
    branches:
      - update-latest-case-study-pdfs

permissions:
  contents: write

jobs:
  replace-pdfs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Wait until all chunks are present
        id: ready
        shell: bash
        run: |
          if [ -f .pdf-staging/READY ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild and commit PDF assets
        if: steps.ready.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat .pdf-staging/st-*.b64 | base64 -d > assets/st-andrews-case-study.pdf
          cat .pdf-staging/lg-*.b64 | base64 -d > assets/ecoai-local-government-case-study.pdf

          echo "813f6b04c343c732453713575903ce03d10c6e1c7dc5adc5325b2dd8ae6ebc39  assets/st-andrews-case-study.pdf" | sha256sum -c -
          echo "c01c04eb804e74a6e394cc949432f2954b800276e48e45c390a499d6a939eb33  assets/ecoai-local-government-case-study.pdf" | sha256sum -c -

          rm -rf .pdf-staging
          rm -f .github/workflows/replace-latest-case-study-pdfs.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace case study PDFs with latest approved versions"
          git push
